<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云端模型设置 · 学习通课程助手</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main class="settings">
    <header>
      <h1>云端模型设置</h1>
      <p>视频弹题和章节测验使用这里配置的模型。题干、选项及必要的题目截图会发送到该服务。</p>
    </header>
    <form id="settings">
      <label for="base-url">Base URL</label>
      <input id="base-url" type="url" placeholder="https://api.example.com/v1" required>
      <label for="model">模型名</label>
      <input id="model" type="text" placeholder="服务商提供的模型 ID" maxlength="200" required>
      <label for="key">API Key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" maxlength="4096" placeholder="输入模型服务商签发的 Key">
      <label class="check"><input id="remember" type="checkbox"> 在此浏览器中记住 API Key</label>
      <p class="hint">默认只保留到浏览器关闭。含图题需要支持图片输入的模型。</p>
      <div class="actions">
        <button class="primary" type="submit">保存设置</button>
        <button id="test" type="button">测试连接</button>
        <button id="clear" type="button">清除密钥</button>
      </div>
    </form>
    <p id="status" class="status" role="status" aria-live="polite">正在读取设置…</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习通课程助手</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <main>
    <header>
      <h1>学习通课程助手</h1>
      <button id="open-settings" type="button">模型设置</button>
    </header>
    <p id="status" class="status" role="status" aria-live="polite">正在识别当前页面…</p>
    <div id="course-controls">
      <div class="preferences course-only">
        <label for="mode">运行模式</label>
        <select id="mode">
          <option value="all">全部任务</option><option value="media">只学习课件</option>
          <option value="work">只做本节测验</option><option value="review">复习视频</option>
        </select>
      </div>
      <div class="preferences course-only">
        <label for="rate">视频倍速</label>
        <select id="rate">
          <option value="1">1×</option><option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
          <option value="site">跟随学习通</option>
        </select>
        <label class="check"><input id="auto-next" type="checkbox" checked> 自动下一节</label>
      </div>
      <label class="check submit-option"><input id="auto-fill" type="checkbox" checked> 自动回填模型答案</label>
      <label class="check submit-option course-only"><input id="auto-submit" type="checkbox" checked> 自动提交弹题和章节测验</label>
      <label class="check submit-option"><input id="save-draft" type="checkbox" checked> 测验中断时尝试暂存</label>
      <label class="check submit-option course-only"><input id="skip-unsupported" type="checkbox"> 跳过不支持的任务点</label>
      <section id="work-panel" class="work-panel" aria-label="答题卡" hidden>
        <label class="check" for="redo-answered"><input id="redo-answered" type="checkbox"> 重新求解已答题</label>
        <p id="work-count" class="work-count"></p>
        <div id="work-groups"></div>
      </section>
      <div class="actions">
        <button id="start" class="primary" type="button" disabled>开始</button>
        <button id="pause" type="button" disabled>暂停</button>
        <button id="stop" type="button" disabled>停止</button>
        <button id="work-submit" type="button" hidden>交卷</button>
      </div>
      <div id="submit-confirm" class="submit-confirm" hidden>
        <p>确认将当前作答提交给学习通？</p>
        <div class="actions">
          <button id="confirm-submit" class="primary" type="button">确认交卷</button>
          <button id="cancel-submit" type="button">返回检查</button>
        </div>
      </div>
    </div>
    <div id="review-actions" class="actions" hidden>
      <button id="export" class="primary" type="button">导出 JSON</button>
      <button id="export-csv" type="button">导出 CSV</button>
      <button id="print-review" type="button">打印批阅结果</button>
    </div>
    <details class="archive">
      <summary>本地批阅归档</summary>
      <label for="archive-select">已保存试卷</label>
      <select id="archive-select" disabled><option value="">暂无归档</option></select>
      <div class="actions">
        <button id="archive-json" type="button" disabled>下载 JSON</button>
        <button id="archive-csv" type="button" disabled>下载 CSV</button>
      </div>
      <p id="archive-status" class="hint" role="status"></p>
    </details>
  </main>
</body>
</html>
